<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Context card demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* A scripted walkthrough of context-card's one line. Every animated value is computed from one clock, `t` in ms,
   so a recorder can step it frame by frame: open with ?t=1500 for a still, or call window.setT(ms).
   The bar, knob and ring are drawn with the same SVG the mod sends the desktop (hooks/register.tsx). */
:root {
  --stage: #0E0E0D; --window: #171716; --band: #222220; --edge: #2E2D2B; --text: #F2F1EC; --dim: #A3A29C;
  --button: #343331; --surface: #1F1E1D; --hover: #2C2B29; --claude: #D97757; --blue: #B1B9F9;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.5); --cursor: #FFFFFF; --cursor-edge: #000000;
}
:root[data-theme="light"] {
  --stage: #EAE8E1; --window: #FAFAF8; --band: #EFEEEC; --edge: #DDDBD6; --text: #1A1A19; --dim: #666666;
  --button: #E4E3DF; --surface: #FFFFFF; --hover: #F0EFEC; --claude: #C15F3C; --blue: #2A4FA3;
  --shadow: 0 8px 28px rgba(20, 20, 19, 0.12); --cursor: #1A1A19; --cursor-edge: #FFFFFF;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--stage); }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 20px; color: var(--text); }
.num { font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.bold { font-weight: 650; }
#stage { position: relative; width: 1200px; height: 720px; overflow: hidden; background: var(--stage); }
#window { position: absolute; left: 40px; top: 28px; width: 1120px; height: 606px; border-radius: 14px; border: 1px solid var(--edge); background: var(--window); overflow: hidden; display: flex; flex-direction: column; }
#titlebar { height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--edge); }
.light { width: 11px; height: 11px; border-radius: 50%; background: var(--edge); }
#titlebar .name { margin-left: 10px; color: var(--dim); }
#main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 28px 20px; }
#transcript { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding-bottom: 18px; }
.skeleton { display: flex; flex-direction: column; gap: 9px; }
.skeleton span { height: 9px; border-radius: 5px; background: var(--edge); }
.reveal { overflow: hidden; flex-shrink: 0; }

/* The card: one line above the prompt. */
#shot { padding: 8px 0 0; }
#band { display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 12px 0 16px; border-radius: 12px; background: var(--band); }
.group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; position: relative; }
#chip { font: inherit; line-height: 20px; height: 20px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px 0 8px; border: 0; border-radius: 6px; background: var(--button); color: var(--text); white-space: nowrap; }
#menu { position: absolute; right: 0; bottom: 30px; min-width: 120px; padding: 4px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; transform-origin: bottom right; }
#menu div { display: flex; justify-content: space-between; gap: 16px; padding: 4px 10px; border-radius: 6px; }
#knob { display: inline-flex; margin-left: -4px; }
#prompt { margin-top: 10px; border: 1px solid var(--edge); border-radius: 14px; background: var(--surface); padding: 14px 16px; color: var(--dim); flex-shrink: 0; }

/* The pointer, its click ring, and the caption under the window. */
#cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; pointer-events: none; z-index: 5; }
#ring { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2px solid var(--claude); pointer-events: none; z-index: 4; opacity: 0; }
#caption { position: absolute; left: 0; right: 0; top: 652px; text-align: center; font-size: 17px; line-height: 24px; }
#caption b { font-weight: 650; }
#progress { position: absolute; left: 40px; top: 706px; height: 2px; background: var(--claude); opacity: .7; }
</style>
</head>
<body>
<div id="stage">
  <div id="window">
    <div id="titlebar"><span class="light"></span><span class="light"></span><span class="light"></span><span class="name">Atlas main</span></div>
    <div id="main">
      <div id="transcript">
        <div class="skeleton"><span style="width: 62%"></span><span style="width: 81%"></span><span style="width: 44%"></span></div>
        <div class="skeleton"><span style="width: 74%"></span><span style="width: 38%"></span></div>
        <div class="skeleton"><span style="width: 58%"></span><span style="width: 86%"></span><span style="width: 31%"></span></div>
        <div class="reveal" id="compacting"><div class="dim">✻ Compacting conversation…</div></div>
        <div class="reveal" id="compacted"><div class="dim">Conversation compacted · API-142 rate-limit retries, summary kept</div></div>
      </div>

      <div id="shot">
        <div id="band">
          <span class="num bold" id="pct"></span>
          <div class="group">
            <span class="num dim" id="used"></span>
            <button id="chip" class="num" type="button"><span id="win"></span><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--dim)" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg></button>
            <div id="menu" class="num"></div>
          </div>
          <div class="group" style="gap: 0">
            <span id="bar"></span>
            <span id="knob"></span>
          </div>
          <span style="flex: 1"></span>
          <div class="group num">
            <span id="weeklyRing"></span>
            <span class="dim">weekly</span>
            <span class="bold" style="color: var(--blue)">20%</span>
            <span class="dim">↻ 4d 21h</span>
          </div>
        </div>
        <div id="prompt">Reply to Claude…</div>
      </div>
    </div>
  </div>

  <div id="ring"></div>
  <svg id="cursor" viewBox="0 0 22 22"><path d="M3 2l0 15.5 4.2-3.9 2.6 6 2.6-1.1-2.6-5.9 5.7-.3z" fill="var(--cursor)" stroke="var(--cursor-edge)" stroke-width="1.2" stroke-linejoin="round"/></svg>
  <div id="caption"></div>
  <div id="progress"></div>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search)
  var isLight = params.get('theme') === 'light'
  if (isLight) document.documentElement.setAttribute('data-theme', 'light')

  var $ = function (id) { return document.getElementById(id) }

  // The mod's own SVG, as hooks/register.tsx builds it.
  var HUE = { claude: '#D97757', warning: '#E0A030', error: '#E5484D', suggestion: '#6B8AFD' }
  var TRACK = '#8884', DIM = '#888C', ON_ACCENT = '#FFFFFF'
  var hueOf = function (p) { return p >= 80 ? HUE.error : p >= 60 ? HUE.warning : HUE.claude }
  var clamp = function (s) { return Math.min(Math.max(s, 0), 1) }
  var svg = function (w, h, body) { return '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' + body + '</svg>' }
  var arc = function (r, share) { var len = 2 * Math.PI * r; return 'stroke-dasharray="' + (len * clamp(share)).toFixed(2) + ' ' + len.toFixed(2) + '"' }
  var barSource = function (w, p, busy) {
    var fill = Math.max(2, Math.round(w * clamp(p / 100)))
    return svg(w, 10, '<rect y="2" width="' + w + '" height="6" rx="3" fill="' + TRACK + '"/><rect y="2" width="' + fill + '" height="6" rx="3" fill="' + (busy ? DIM : hueOf(p)) + '"/>')
  }
  var COMPRESS = 'M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7'
  var knobSource = function (state, p, left) {
    if (state === 'armed') {
      return svg(20, 20, '<circle cx="10" cy="10" r="10" fill="' + HUE.claude + '"/>' +
        '<circle cx="10" cy="10" r="8.2" fill="none" stroke="' + ON_ACCENT + '" stroke-opacity="0.35" stroke-width="1.6"/>' +
        '<circle cx="10" cy="10" r="8.2" fill="none" stroke="' + ON_ACCENT + '" stroke-width="1.6" stroke-linecap="round" ' + arc(8.2, left) + ' transform="rotate(-90 10 10)"/>' +
        '<path d="M6.6 10.3l2.3 2.3 4.5-4.9" fill="none" stroke="' + ON_ACCENT + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>')
    }
    if (state === 'compacting') {
      return svg(20, 20, '<circle cx="10" cy="10" r="10" fill="' + TRACK + '"/><circle cx="10" cy="10" r="4.8" fill="none" stroke="' + DIM + '" stroke-width="1.5"/><path d="M10 5.2a4.8 4.8 0 0 1 0 9.6z" fill="' + DIM + '"/>')
    }
    var hot = p >= 80
    var icon = hot ? ON_ACCENT : p >= 60 ? hueOf(p) : DIM
    return svg(20, 20, '<circle cx="10" cy="10" r="10" fill="' + (hot ? hueOf(p) : TRACK) + '"/>' +
      '<g transform="translate(4 4) scale(0.5)"><path d="' + COMPRESS + '" fill="none" stroke="' + icon + '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>')
  }
  var ringSource = function (used, week, hue) {
    return svg(16, 16, '<circle cx="8" cy="8" r="6.9" fill="none" stroke="' + TRACK + '" stroke-width="2"/>' +
      '<circle cx="8" cy="8" r="6.9" fill="none" stroke="' + hue + '" stroke-width="2" stroke-linecap="round" ' + arc(6.9, used) + ' transform="rotate(-90 8 8)"/>' +
      '<circle cx="8" cy="8" r="3.2" fill="none" stroke="' + TRACK + '" stroke-width="1.8"/>' +
      '<circle cx="8" cy="8" r="3.2" fill="none" stroke="' + DIM + '" stroke-width="1.8" ' + arc(3.2, week) + ' transform="rotate(-90 8 8)"/>')
  }
  var compact = function (k) { return (Math.round(k * 10) / 10 + 'k').replace('.0k', 'k') }
  // The text hues the desktop theme gives claude, warning and error.
  var textHue = function (p) { return p >= 80 ? (isLight ? '#AB2B3F' : '#FF6B80') : p >= 60 ? (isLight ? '#966C1E' : '#FFC107') : 'var(--claude)' }

  // Weekly: 20% of the plan used, 4d 21h left of the week (2d 3h gone).
  $('weeklyRing').innerHTML = ringSource(0.2, (2 * 24 + 3) / (7 * 24), HUE.suggestion)
  var OPTIONS = ['400k', '500k', '600k', 'Auto', 'Off']
  $('menu').innerHTML = OPTIONS.map(function (o) { return '<div data-o="' + o + '"><span>' + o + '</span><span class="dim mark"></span></div>' }).join('')

  // The script: each step moves the pointer to a target, clicks at `at`, and the caption explains it.
  var STEPS = [
    { at: 1600, target: 'knob', caption: '<b>Click the knob</b> — it turns into a check for three seconds' },
    { at: 3100, target: 'knob', caption: '<b>Click again</b> — it compacts, as /compact does' },
    { at: 7600, target: 'chip', caption: '<b>The window is a dropdown</b> — the auto-compact window, as /autocompact sets it' },
    { at: 10000, target: 'opt600k', caption: '<b>600k</b> — the line measures against it at once' },
  ]
  var TOTAL = 13400
  var ARM_MS = 3000
  // How long the compaction runs after the second click.
  var COMPACT_MS = 2600
  var MOVE = 800
  var USED = 135.2, KEPT = 41.8

  var ease = function (p) { return p < 0 ? 0 : p > 1 ? 1 : p * p * (3 - 2 * p) }
  var prog = function (t, start, dur) { return ease((t - start) / dur) }
  var centre = function (id) {
    var r = $(id).getBoundingClientRect(), s = $('stage').getBoundingClientRect()
    return { x: r.left - s.left + Math.min(r.width / 2, 60), y: r.top - s.top + r.height / 2 }
  }
  var reveal = function (id, p) {
    var el = $(id)
    el.style.height = p >= 1 ? 'auto' : Math.round(p * el.firstElementChild.offsetHeight) + 'px'
    el.style.opacity = p
  }
  Array.prototype.forEach.call($('menu').children, function (row) { row.id = 'opt' + row.getAttribute('data-o') })

  window.TOTAL = TOTAL
  window.setT = function (t) {
    var armedAt = STEPS[0].at, compactAt = STEPS[1].at, doneAt = compactAt + COMPACT_MS
    var state = t >= compactAt && t < doneAt ? 'compacting' : t >= armedAt && t < compactAt ? 'armed' : 'idle'
    var windowK = t >= STEPS[3].at ? 600 : 500
    var used = t >= doneAt ? KEPT : USED
    var pct = Math.round(used / windowK * 100)

    $('pct').textContent = pct + '%'
    $('pct').style.color = textHue(pct)
    // The saved window is the one in force, so only the used figure is written out beside the dropdown.
    $('used').textContent = compact(used) + ' /'
    $('win').textContent = windowK + 'k'
    $('bar').innerHTML = barSource(120, pct, state === 'compacting')
    $('knob').innerHTML = knobSource(state, pct, 1 - (t - armedAt) / ARM_MS)

    var menuOpen = prog(t, STEPS[2].at, 160) - prog(t, STEPS[3].at + 120, 160)
    $('menu').style.opacity = menuOpen
    $('menu').style.visibility = menuOpen > 0 ? 'visible' : 'hidden'
    $('menu').style.transform = 'scale(' + (0.96 + 0.04 * menuOpen) + ')'
    Array.prototype.forEach.call($('menu').children, function (row) {
      var o = row.getAttribute('data-o')
      var on = o === windowK + 'k'
      row.querySelector('.mark').textContent = on ? '✓' : ''
      row.style.fontWeight = on ? 650 : 400
      row.style.background = o === '600k' && t >= STEPS[3].at - 300 ? 'var(--hover)' : 'transparent'
    })

    reveal('compacting', prog(t, compactAt + 150, 250) - prog(t, doneAt, 250))
    $('compacting').style.display = t > doneAt + 250 ? 'none' : ''
    reveal('compacted', prog(t, doneAt + 150, 400))

    // The pointer travels to each target during the MOVE before its click, and rests there in between.
    var from = { x: 640, y: 300 }
    for (var i = 0; i < STEPS.length; i++) {
      var to = centre(STEPS[i].target)
      var p = prog(t, STEPS[i].at - MOVE - 120, MOVE)
      from = { x: from.x + (to.x - from.x) * p, y: from.y + (to.y - from.y) * p }
    }
    $('cursor').style.transform = 'translate(' + (from.x - 3) + 'px,' + (from.y - 2) + 'px)'
    $('cursor').style.display = params.has('still') ? 'none' : ''

    var ring = $('ring'), ringOn = 0
    STEPS.forEach(function (step) {
      var q = (t - step.at) / 420
      if (q >= 0 && q <= 1) {
        ringOn = 1
        ring.style.transform = 'translate(' + from.x + 'px,' + from.y + 'px) scale(' + (0.35 + 0.65 * q) + ')'
        ring.style.opacity = 0.9 * (1 - q)
      }
    })
    if (!ringOn) ring.style.opacity = 0

    // One caption at a time, shown from just before its click until the next one takes over.
    var caption = ''
    var opacity = 0
    STEPS.forEach(function (step, index) {
      var start = step.at - MOVE
      var end = index + 1 < STEPS.length ? STEPS[index + 1].at - MOVE : TOTAL
      if (t >= start && t < end) {
        caption = step.caption
        opacity = Math.min(prog(t, start, 250), 1 - prog(t, end - 250, 250))
      }
    })
    $('caption').innerHTML = caption
    $('caption').style.opacity = opacity
    $('progress').style.width = Math.round((t / TOTAL) * 1120) + 'px'
  }

  // The README stills: the card and the prompt, cropped by the recorder to this box.
  window.SHOT = function () {
    var r = $('shot').getBoundingClientRect()
    return { x: r.left - 16, y: r.top - 10, width: r.width + 32, height: r.height + 18 }
  }

  if (params.has('t')) {
    window.setT(Number(params.get('t')))
  } else {
    var start = performance.now()
    var tick = function (now) {
      window.setT((now - start) % TOTAL)
      requestAnimationFrame(tick)
    }
    requestAnimationFrame(tick)
  }
})()
</script>
</body>
</html>
